name: CI

on:
  push:
    branches:
      - develop
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-nik_crafts-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server

    env:
      # Frappe and ERPNext cut each weekly release from version-16-hotfix. The nightly run
      # tests against it, every other run against what is already released.
      UPSTREAM_BRANCH: ${{ github.event_name == 'schedule' && 'version-16-hotfix' || 'version-16' }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$UPSTREAM_BRANCH" --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch "$UPSTREAM_BRANCH" --skip-assets
          bench get-app nik_crafts $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app nik_crafts
          bench build

      - name: Validate Dependencies
        # The version number of ERPNext on version-16-hotfix lags behind its releases.
        if: env.UPSTREAM_BRANCH == 'version-16'
        working-directory: /home/runner/frappe-bench
        run: bench validate-dependencies

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app nik_crafts

      - name: Migrate
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site migrate

      - name: Uninstall
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site uninstall-app nik_crafts --yes --no-backup
          bench --site test_site list-apps
          # uninstall-app also exits with 0 when it refuses to remove the app
          if bench --site test_site list-apps | grep -q nik_crafts; then exit 1; fi

  image:
    # The build takes about 20 minutes and clones the app by branch from GitHub, which a pull request does not have.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Image
    timeout-minutes: 60

    env:
      # Read by docker compose and by the compose files of frappe_docker
      COMPOSE_FILE: compose.yaml:overrides/compose.mariadb.yaml:overrides/compose.redis.yaml:overrides/compose.noproxy.yaml
      CUSTOM_IMAGE: nik_crafts
      CUSTOM_TAG: nightly
      PULL_POLICY: never
      DB_PASSWORD: root

    steps:
      - name: Clone frappe_docker
        uses: actions/checkout@v7.0.1
        with:
          repository: frappe/frappe_docker
          persist-credentials: false

      - name: Build
        env:
          # frappe_docker publishes its base images for version-16 only, not for version-16-hotfix.
          FRAPPE_BRANCH: version-16
          APPS_JSON: |
            [
              {"url": "https://github.com/frappe/erpnext", "branch": "version-16"},
              {"url": "${{ github.server_url }}/${{ github.repository }}", "branch": "${{ github.ref_name }}"}
            ]
        run: |
          printf '%s' "$APPS_JSON" > apps.json
          docker build \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH="$FRAPPE_BRANCH" \
            --secret=id=apps_json,src=apps.json \
            --tag="$CUSTOM_IMAGE:$CUSTOM_TAG" \
            --file=images/layered/Containerfile .

      - name: Create Site
        run: |
          docker compose up -d
          docker compose exec -T backend bench new-site nightly.localhost --mariadb-user-host-login-scope='%' --db-root-password "$DB_PASSWORD" --admin-password admin --install-app nik_crafts

      - name: Print PDF
        run: |
          curl -fsS --retry 5 -c cookies.txt -d usr=Administrator -d pwd=admin http://nightly.localhost:8080/api/method/login
          curl -fsS -b cookies.txt -o user.pdf 'http://nightly.localhost:8080/api/method/frappe.utils.print_format.download_pdf?doctype=User&name=Administrator&pdf_generator=chrome'
          file user.pdf | grep PDF

      - name: Show Logs
        if: failure()
        run: docker compose logs
