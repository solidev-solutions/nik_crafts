exclude: 'node_modules'
default_stages: [pre-commit]
fail_fast: false
default_language_version:
  node: system


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "nik_crafts.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  # The prettier mirror of pre-commit is archived, so the hook is defined here.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: prettier --write --ignore-unknown
        additional_dependencies: ["prettier@3.9.10"]
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nik_crafts/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nik_crafts/templates/includes/.*|
                nik_crafts/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.14.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # eslint.config.js loads the last two packages.
        additional_dependencies: ["eslint@10.14.0", "@eslint/js@10.0.1", "globals@17.14.0"]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nik_crafts/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nik_crafts/templates/includes/.*|
                nik_crafts/public/js/lib/.*
            )$

  - repo: local
    hooks:
      - id: no-docs
        name: "No documentation files"
        language: fail
        entry: "No docs/ folder. Markdown is limited to README.md, SECURITY.md, AGENTS.md, CLAUDE.md, issue and pull request templates, .claude/skills/ and notification templates."
        files: '(?i)((^|/)docs/|\.(md|mdx|mdc|markdown|rst|adoc)$)'
        exclude: '^(README|SECURITY|AGENTS|CLAUDE)\.md$|^\.github/(ISSUE_TEMPLATE/[^/]+|PULL_REQUEST_TEMPLATE/[^/]+|(?i:pull_request_template))\.md$|^\.claude/skills/|^nik_crafts/[^/]+/notification/[^/]+/[^/]+\.md$'

      - id: no-local-stack
        name: "No local stack files"
        language: fail
        entry: "The local Docker stack and machine settings stay outside this repository."
        files: '(?i)(^|/)((docker-)?compose([.-][^/]+)?\.ya?ml|([^/]+\.)?(dockerfile|containerfile)([.-][^/]+)?|\.dockerignore|docker-bake(\.[^/]+)?\.(hcl|json)|\.devcontainer(/.*)?|\.?devcontainer\.json|\.env([.-][^/]*)?|\.envrc)$'
        exclude: '^\.github/workflows/'

      - id: doctype-prefix
        name: "DocTypes carry the NC prefix"
        language: fail
        entry: "Own DocTypes start with NC, for example NC Time Entry."
        files: '^nik_crafts/[^/]+/doctype/(?!nc_)[^/]+/'

      - id: check-fixtures
        name: "The checks above match their fixtures"
        language: python
        additional_dependencies: [pyyaml]
        entry: python .github/helper/test_checks.py
        files: '^\.pre-commit-config\.yaml$|^\.github/helper/'
        pass_filenames: false

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
