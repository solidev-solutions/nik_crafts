exclude: 'node_modules'
default_stages: [pre-commit]
fail_fast: false
default_language_version:
  node: system


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "nik_crafts.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
        # Search for conflict markers on every run. By default the hook only searches while git is merging.
        args: [--assume-in-merge]
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  # The prettier mirror of pre-commit is archived, so the hook is defined here.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: prettier --write --ignore-unknown
        additional_dependencies: ["prettier@3.9.10"]
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nik_crafts/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nik_crafts/templates/includes/.*|
                nik_crafts/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.15.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # eslint.config.js loads the last two packages.
        additional_dependencies: ["eslint@10.15.0", "@eslint/js@10.0.1", "globals@17.14.0"]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                nik_crafts/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                nik_crafts/templates/includes/.*|
                nik_crafts/public/js/lib/.*
            )$

  - repo: local
    hooks:
      - id: no-docs
        name: "No documentation files"
        language: fail
        entry: "No docs/ folder. Markdown is limited to README.md, SECURITY.md, AGENTS.md, CLAUDE.md, .claude/skills/ and notification templates."
        files: '^docs/|\.md$'
        exclude: |
            (?x)^(
                (README|SECURITY|AGENTS|CLAUDE)\.md|
                \.claude/skills/.*|
                nik_crafts/[^/]+/notification/.*
            )$

      - id: no-local-stack
        name: "No local stack files"
        language: fail
        entry: "The local Docker stack stays outside this repository."
        files: |
            (?x)(^|/)(
                (docker-)?compose(\.[^/]+)?\.ya?ml|
                Dockerfile(\.[^/]+)?|
                Containerfile(\.[^/]+)?|
                \.dockerignore|
                \.devcontainer/.*
            )$

      - id: doctype-prefix
        name: "DocTypes carry the NC prefix"
        language: fail
        entry: "Own DocTypes start with NC, for example NC Time Entry."
        files: '^nik_crafts/[^/]+/doctype/(?!nc_)[^/]+/'

      - id: feature-places
        name: "Feature code lives in doctype/, api/, hooks/, application/, domain/, repositories/ or contract.py"
        language: pygrep
        entry: '\S'
        args: [--multiline]
        files: '^nik_crafts/nc_(?!core/)[^/]+/(?!(doctype|api|hooks|application|domain|repositories|report|page|dashboard_chart_source|web_form|notification)/)(?!contract\.py$)'
        types: [python]

      - id: shared-packages-start-empty
        name: "engine/ and nc_core/ keep an empty __init__.py"
        language: pygrep
        entry: '\S'
        args: [--multiline]
        files: '^nik_crafts/(engine|nc_core)/__init__\.py$'

      - id: exceptions-carry-a-reason
        name: "An exception is a line of its own above the finding: # nosemgrep: <rule> -- <why it is needed>"
        language: pygrep
        entry: '^(?!\s*(#|//) nosemgrep: [\w.-]+(, [\w.-]+)* -- [^\s,]+ [^,]*[^\s,]$)(?i:[^a-zA-Z0-9]*nosem|.* nosem)'
        types_or: [python, pyi, javascript, jsx, ts, tsx, json]

      - id: bypass-in-repositories
        name: "A bypass stands in repositories/ or nc_core/"
        language: pygrep
        entry: 'nosemgrep: ([\w.-]+, )*[\w.-]*(permission-bypass|validation-bypass|manual-rollback|erpnext-through-documents|frappe-setuser|frappe-manual-commit)\b'
        files: '^nik_crafts/'
        types_or: [python, pyi]
        exclude: |
            (?x)^(
                nik_crafts/nc_[^/]+/repositories/.*|
                nik_crafts/nc_core/.*|
                nik_crafts/patches/.*|
                nik_crafts/tests/.*|
                (.*/)?test_[^/]*\.py
            )$

      - id: import-linter
        name: "Imports follow the architecture"
        language: python
        entry: lint-imports
        additional_dependencies: ["import-linter==2.16"]
        pass_filenames: false
        types_or: [python, toml]

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.185.0
    hooks:
      - id: semgrep
        name: "Rules of the architecture, of Frappe and of semgrep"
        args:
          - --config=.semgrep/architecture.yml
          - --config=r/python.lang.correctness
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/code_quality.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/frappe_correctness.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/hooks.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/report.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/translate.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/ux.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/security/authorization.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/security/filesystem.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/security/format_string_injection.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/security/rce.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/security/sql.yml
          - --config=https://raw.githubusercontent.com/frappe/semgrep-rules/81a6e3d47a328249e8ddf04c586e493dd5553002/rules/security/whitelisted.yml
          - --error
          - --metrics=off
          - --disable-version-check
          - --skip-unknown-extensions
        types_or: [python, pyi, javascript, jsx, ts, tsx, json]
        require_serial: true
        exclude: '^\.semgrep/'

      - id: semgrep
        alias: semgrep-rule-tests
        name: "The rules of the architecture catch what they should"
        args: [--test, --strict, --metrics=off, --config=.semgrep/architecture.yml, .semgrep/architecture.py]
        files: '^\.semgrep/'
        pass_filenames: false

  - repo: local
    hooks:
      - id: polint
        name: "Translations: every text is German"
        language: python
        additional_dependencies: ["polint==0.5"]
        entry: polint --ignore=location,unsorted
        files: '^nik_crafts/locale/de\.po$'

      - id: dennis
        name: "Translations: placeholders are kept"
        language: python
        additional_dependencies: ["dennis==1.3.0"]
        entry: dennis-cmd lint --strict --rules E201,W202
        files: '^nik_crafts/locale/de\.po$'

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
