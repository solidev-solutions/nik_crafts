[project]
name = "nik_crafts"
authors = [
    { name = "Solidev - Thomas Liska", email = "contact@solidev.solutions"}
]
description = "Business software for small craft businesses, built on ERPNext"
requires-python = ">=3.14"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["license.txt"]
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"
# The test file of the semgrep rules holds the code the rules must reject.
extend-exclude = [".semgrep"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
    "INP",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.importlinter]
root_package = "nik_crafts"
include_external_packages = true

# As a source, nc_core and engine are named with a wildcard, because import-linter stops at a module
# that does not exist yet. The wildcard covers what lies inside the package, not its own __init__.py.
# The pull request that creates one of the two packages names it without the wildcard.

[[tool.importlinter.contracts]]
name = "Features stay apart and build on nc_core, nc_core builds on engine"
type = "layers"
containers = ["nik_crafts"]
# The feature modules stand in one line between patches and nc_core: "nc_projects | nc_times".
# patches lies on top: the rules for data access and for a bypass leave it out, so nothing imports it.
layers = [
    "patches",
    "(nc_core)",
    "(engine)",
]
exhaustive = true
exhaustive_ignores = [
    "config",
    "hooks",
    "templates",
]
ignore_imports = ["nik_crafts.** -> nik_crafts.*.contract"]
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "A feature reaches another feature only through its contract.py, and nothing imports a patch. Every feature module is listed in the line of layers above nc_core."

[[tool.importlinter.contracts]]
name = "Inside a module imports point downwards"
type = "layers"
containers = ["nik_crafts.*"]
# The first line holds the entry points: ours, and the folders Frappe calls into.
layers = [
    "(doctype) | (api) | (hooks) | (contract) | (report) | (page) | (dashboard_chart_source) | (web_form) | (notification)",
    "(application)",
    "(repositories)",
    "(domain)",
]
broken_contract_guidance = "Entry points call application, application calls repositories and domain. Nothing imports an entry point."

[[tool.importlinter.contracts]]
name = "Rules and engine run without Frappe"
type = "forbidden"
source_modules = ["nik_crafts.*.domain", "nik_crafts.engine.**"]
forbidden_modules = ["frappe", "erpnext"]
broken_contract_guidance = "domain/ and engine/ are plain Python and return values. The caller in application/ talks to Frappe."

[[tool.importlinter.contracts]]
name = "Only nc_core.erpnext imports ERPNext"
type = "forbidden"
source_modules = ["nik_crafts"]
forbidden_modules = ["erpnext"]
ignore_imports = [
    "nik_crafts.nc_core.erpnext -> erpnext",
    "nik_crafts.nc_core.erpnext.** -> erpnext",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "Ask nc_core/erpnext/ for the value. It returns plain values, our own models or the draft of a follow-up document."

[[tool.importlinter.contracts]]
name = "Shared code does not know features"
type = "forbidden"
source_modules = ["nik_crafts.nc_core.**", "nik_crafts.engine.**"]
forbidden_modules = ["nik_crafts.*.contract"]
broken_contract_guidance = "Shared code never calls a feature. Pass the value in, or move the code into the feature."

[[tool.importlinter.contracts]]
name = "Another feature is called from application only"
type = "forbidden"
source_modules = [
    "nik_crafts.*.doctype",
    "nik_crafts.*.api",
    "nik_crafts.*.hooks",
    "nik_crafts.*.contract",
    "nik_crafts.*.report",
    "nik_crafts.*.page",
    "nik_crafts.*.dashboard_chart_source",
    "nik_crafts.*.web_form",
    "nik_crafts.*.notification",
    "nik_crafts.*.repositories",
    "nik_crafts.*.domain",
]
forbidden_modules = ["nik_crafts.*.contract"]
allow_indirect_imports = true
broken_contract_guidance = "Call the other feature from a function in application/. Entry points call that function."

[[tool.importlinter.contracts]]
name = "Features do not depend on each other in a circle"
type = "acyclic_siblings"
ancestors = ["nik_crafts"]
depth = 0
broken_contract_guidance = "One of the two features must not know the other. Pass the value in, or let the other feature react to the document event."
