[project]
name = "nik_crafts"
authors = [
    { name = "Solidev - Thomas Liska", email = "contact@solidev.solutions"}
]
description = "Business software for small craft businesses, built on ERPNext"
requires-python = ">=3.14"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["license.txt"]
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[dependency-groups]
rules = ["mutmut==3.8.1", "pytest==9.2.0"]

[tool.bench.frappe-dependencies]
frappe = ">=16.60.2,<17.0.0"
erpnext = ">=16.60.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = [".semgrep"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
    "INP",
    "TID251",
    "BLE001",
    "C901",
    "PLR0912",
    "PLR0915",
    "ARG",
    "ERA001",
    "PIE790",
    "PGH003",
    "PGH004",
    "S",
    "T20",
    "SIM",
    "RET",
    "A",
]
ignore = [
    "E101", # after ruff format, a docstring with nested indentation keeps a tab followed by spaces
    "E501", # the formatter wraps what it can; a long text or an exception comment with its reason stays on one line
    "RET503", # frappe.throw is annotated -> None, so the rule asks for an unreachable return None after it
    "SIM105", # the contextlib.suppress(Exception) it proposes is not reported by S110
    "W191", # the code is indented with tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest".msg = "Rule tests are a plain unittest.TestCase, because bench run-tests runs them too and the bench has no pytest."
"unittest.mock".msg = "Tests run against real Frappe and ERPNext. A rule that needs no site lives in domain/ and is tested there."
"__future__.annotations".msg = "It turns every annotation of the file into a string, and Frappe neither checks nor converts an endpoint argument annotated with a string. Python 3.14 resolves a forward reference without it."
"frappe.tests.utils.whitelist_for_tests".msg = "A test defines no endpoint, neither with frappe.whitelist nor with this helper that Frappe's rule for test files suggests: it whitelists the same way, and the endpoint rules do not see it. Call the endpoints of the feature from the test."

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.importlinter]
root_package = "nik_crafts"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Features stay apart and build on nc_core, nc_core builds on engine"
type = "layers"
containers = ["nik_crafts"]
layers = [
    "tests",
    "patches",
    "(nc_core)",
    "(engine)",
]
exhaustive = true
exhaustive_ignores = [
    "config",
    "hooks",
    "templates",
]
ignore_imports = ["nik_crafts.** -> nik_crafts.*.contract"]
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "A feature reaches another feature only through its contract.py, and nothing imports a patch or the tests package. Every feature module is listed in the line of layers above nc_core."

[[tool.importlinter.contracts]]
name = "Inside a module imports point downwards"
type = "layers"
containers = ["nik_crafts.*"]
layers = [
    "(doctype) | (api) | (hooks) | (contract) | (report) | (page) | (dashboard_chart_source) | (web_form) | (notification)",
    "(application)",
    "(repositories)",
    "(domain)",
]
broken_contract_guidance = "Entry points call application, application calls repositories and domain. Nothing imports an entry point."

[[tool.importlinter.contracts]]
name = "Rules and engine run without Frappe"
type = "forbidden"
source_modules = ["nik_crafts.*.domain", "nik_crafts.engine.**"]
forbidden_modules = ["frappe", "erpnext"]
broken_contract_guidance = "domain/ and engine/ are plain Python and return values. The caller in application/ talks to Frappe."

[[tool.importlinter.contracts]]
name = "Only nc_core.erpnext imports ERPNext"
type = "forbidden"
source_modules = ["nik_crafts"]
forbidden_modules = ["erpnext"]
ignore_imports = [
    "nik_crafts.nc_core.erpnext -> erpnext",
    "nik_crafts.nc_core.erpnext.** -> erpnext",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "Ask nc_core/erpnext/ for the value. It returns plain values, our own models or the draft of a follow-up document."

[[tool.importlinter.contracts]]
name = "Shared code does not know features"
type = "forbidden"
source_modules = ["nik_crafts.nc_core", "nik_crafts.engine.**"]
forbidden_modules = ["nik_crafts.*.contract"]
broken_contract_guidance = "Shared code never calls a feature. Pass the value in, or move the code into the feature."

[[tool.importlinter.contracts]]
name = "Another feature is called from application only"
type = "forbidden"
source_modules = [
    "nik_crafts.*.doctype",
    "nik_crafts.*.api",
    "nik_crafts.*.hooks",
    "nik_crafts.*.contract",
    "nik_crafts.*.report",
    "nik_crafts.*.page",
    "nik_crafts.*.dashboard_chart_source",
    "nik_crafts.*.web_form",
    "nik_crafts.*.notification",
    "nik_crafts.*.repositories",
    "nik_crafts.*.domain",
]
forbidden_modules = ["nik_crafts.*.contract"]
allow_indirect_imports = true
broken_contract_guidance = "Call the other feature from a function in application/. Entry points call that function."

[[tool.importlinter.contracts]]
name = "Features do not depend on each other in a circle"
type = "acyclic_siblings"
ancestors = ["nik_crafts"]
depth = 0
broken_contract_guidance = "One of the two features must not know the other. Pass the value in, or let the other feature react to the document event."

[tool.mutmut]
source_paths = ["nik_crafts/"]
only_mutate = ["nik_crafts/*/domain/*.py", "nik_crafts/engine/*.py"]
do_not_mutate = ["*/test_*.py"]

[tool.pytest]
testpaths = ["nik_crafts/*/domain", "nik_crafts/engine"]
