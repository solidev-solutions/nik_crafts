# semgrep tests a rule on architecture.py alone, so the test never sees a rule's paths.
rules:
  - id: database-in-repositories
    languages: [python]
    severity: HIGH
    message: >-
      Data access lives in repositories/ or nc_core/.
      Entry points and application call a repository function.
    pattern-either:
      - pattern: frappe.db
      - pattern: frappe.qb
      - patterns:
          - pattern: frappe.local.$HANDLE
          - metavariable-regex:
              metavariable: $HANDLE
              regex: ^(db|qb|primary_db|replica_db)$
      - patterns:
          - pattern: frappe.$FUNCTION(...)
          - metavariable-regex:
              metavariable: $FUNCTION
              regex: ^(get_doc|get_lazy_doc|get_cached_doc|get_last_doc|get_single|get_single_value|get_cached_value|get_value|set_value|get_list|get_all|new_doc|copy_doc|delete_doc|delete_doc_if_exists|rename_doc|import_doc|reload_doc|reload_doctype|make_property_setter|get_query|get_query_builder)$
      - pattern: frappe.client.$FUNCTION(...)
      - patterns:
          - pattern: frappe.model.$MODULE.$FUNCTION(...)
          - metavariable-regex:
              metavariable: $MODULE
              regex: ^(document|delete_doc|rename_doc|mapper|naming|workflow|create_new|db_query|qb_query)$
      - pattern: import frappe.database
      - pattern: import frappe.query_builder
      - pattern: import pypika
      - patterns:
          - pattern: $DOC.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(db_set|db_get|db_insert|db_update|db_update_all|get_db_value|load_from_db|get_latest|update_child_table|update_children|update_single|deferred_insert|queue_action|_save|_submit|_cancel)$
      - pattern: $DOC.insert()
      - pattern: $DOC.insert($ARGUMENT)
      - patterns:
          - pattern: $DOC.insert(..., $PARAMETER=$VALUE, ...)
          - metavariable-regex:
              metavariable: $PARAMETER
              regex: ^(ignore_permissions|ignore_links|ignore_if_duplicate|ignore_mandatory|set_name|set_child_names)$
      - pattern: $DOC.save()
      - pattern: $DOC.save(**$OPTIONS)
      - patterns:
          - pattern: $DOC.save(..., $PARAMETER=$VALUE, ...)
          - metavariable-regex:
              metavariable: $PARAMETER
              regex: ^(ignore_permissions|ignore_version)$
      - pattern: $DOC.delete()
      - pattern: $DOC.delete(**$OPTIONS)
      - patterns:
          - pattern: $DOC.delete(..., $PARAMETER=$VALUE, ...)
          - metavariable-regex:
              metavariable: $PARAMETER
              regex: ^(ignore_permissions|force|delete_permanently)$
      - pattern: $DOC.submit()
      - pattern: $DOC.cancel()
      - pattern: $DOC.discard()
      - pattern: $DOC.reload()
    paths:
      exclude:
        - /nik_crafts/nc_*/repositories
        - /nik_crafts/nc_core
        - /nik_crafts/patches
        - test_*.py
        - /nik_crafts/tests

  - id: erpnext-through-documents
    languages: [python]
    severity: HIGH
    message: >-
      ERPNext's tables change only through the document: save, submit, cancel.
      A direct write names an own table as a plain string in the call ("NC ..."),
      and raw SQL and changes to a table's structure live in patches/.
    patterns:
      - pattern-either:
          - pattern: frappe.db.$METHOD(...)
          - patterns:
              - pattern: frappe.local.$HANDLE.$METHOD(...)
              - metavariable-regex:
                  metavariable: $HANDLE
                  regex: ^(db|primary_db|replica_db)$
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $DB.$METHOD($DOCTYPE, ...)
                  - patterns:
                      - pattern: $DB.$METHOD(..., $PARAMETER=$DOCTYPE, ...)
                      - metavariable-regex:
                          metavariable: $PARAMETER
                          regex: ^(dt|doctype)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(set_value|set_single_value|delete|truncate|bulk_insert|bulk_update)$
              - metavariable-regex:
                  metavariable: $DOCTYPE
                  regex: ^(?!["']NC [^"']*["']$)
          - patterns:
              - pattern: $DB.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(sql|sql_list|sql_ddl|multisql|execute_query|add_index|add_unique|rename_column|rename_table|change_column_type|updatedb|create_sequence|set_next_sequence_val)$
    paths:
      exclude:
        - /nik_crafts/patches

  - id: permission-bypass
    languages: [python]
    severity: HIGH
    message: >-
      This turns off a permission check of Frappe or acts as another user. insert, save and delete take
      their switches by name, and an argument without a name is read as ignore_permissions: on another
      object name the argument, as in image.save(fp=path). Act as the user wherever possible. An intended
      bypass stands in repositories/ or nc_core/, and the line directly above it holds nothing but:
      # nosemgrep: permission-bypass -- <why it is needed>
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CALL(..., $SWITCH=$VALUE, ...)
              - pattern: $OBJECT.$SWITCH = $VALUE
              - pattern: '{..., "$SWITCH": $VALUE, ...}'
              - pattern: $OBJECT["$SWITCH"] = $VALUE
              - pattern: setattr($OBJECT, "$SWITCH", $VALUE)
              - pattern: $OBJECT.setdefault("$SWITCH", $VALUE)
              - patterns:
                  - pattern: |
                      def $FUNCTION(..., $SWITCH, ...):
                          ...
                  - focus-metavariable: $SWITCH
          - metavariable-regex:
              metavariable: $SWITCH
              regex: ^ignore_(?!share_permissions$)\w*perm\w*$
      - patterns:
          - pattern-either:
              - pattern: $DOC.insert($SWITCH)
              - patterns:
                  - pattern: $DOC.insert($FIRST, $SECOND)
                  - metavariable-regex:
                      metavariable: $FIRST
                      regex: ^(True|False|None)$
              - pattern: $DOC.insert($FIRST, $SECOND, $THIRD, ...)
              - pattern: $DOC.save($SWITCH, ...)
              - pattern: $DOC.delete($SWITCH, ...)
          - pattern-not: $DOC.$METHOD("...", ...)
          - pattern-not: frappe.db.delete(...)
          - pattern-not: frappe.local.$HANDLE.delete(...)
          - pattern-not: frappe.cache.delete(...)
          - pattern-not: frappe.client.$FUNCTION(...)
          - pattern-not: requests.$METHOD(...)
          - pattern-not: $QUERY.into(...). ... .insert(...)
          - pattern-not-inside: $QUERY.insert(...). ... .run(...)
      - patterns:
          - pattern-either:
              - pattern: $MODULE.$DELETE(..., for_reload=$VALUE, ...)
              - pattern: $MODULE.$DELETE($DOCTYPE, $NAME, $FORCE, $IGNORE_DOCTYPES, $FOR_RELOAD, ...)
          - metavariable-regex:
              metavariable: $DELETE
              regex: ^delete_doc(_if_exists)?$
      - patterns:
          - pattern: $OBJECT.$RENAME(..., $VALIDATE=$VALUE, ...)
          - metavariable-regex:
              metavariable: $RENAME
              regex: ^(rename_doc|rename|_rename)$
          - metavariable-regex:
              metavariable: $VALIDATE
              regex: ^(validate|validate_rename)$
      - pattern: $MODULE.rename_doc($DOCTYPE, $OLD, $NEW, $FORCE, $MERGE, $IGNORE_PERMISSIONS, ...)
      - pattern: $OBJECT.get_list(..., user=$USER, ...)
      - pattern: frappe.session.user = $USER
      - pattern: frappe.local.session.user = $USER
      - pattern: frappe.session["user"] = $USER
      - pattern: frappe.local.session["user"] = $USER
      - pattern: frappe.session.update(...)
      - pattern: frappe.local.session.update(...)
      - pattern: frappe.local.session = $SESSION
      - patterns:
          - pattern: $LOGIN_MANAGER.$LOGIN(...)
          - metavariable-regex:
              metavariable: $LOGIN
              regex: ^(login_as|login_as_guest|impersonate)$
    paths:
      exclude:
        - /nik_crafts/patches
        - test_*.py
        - /nik_crafts/tests

  - id: validation-bypass
    languages: [python]
    severity: HIGH
    message: >-
      This writes past the controller, so the rules in domain/ and Frappe's own checks are not asked.
      Save the document wherever possible. An intended bypass stands in repositories/ or nc_core/,
      and the line directly above it holds nothing but:
      # nosemgrep: validation-bypass -- <why it is needed>
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CALL(..., $SWITCH=$VALUE, ...)
              - pattern: $OBJECT.$SWITCH = $VALUE
              - pattern: '{..., "$SWITCH": $VALUE, ...}'
              - pattern: $OBJECT["$SWITCH"] = $VALUE
              - pattern: setattr($OBJECT, "$SWITCH", $VALUE)
              - pattern: $OBJECT.setdefault("$SWITCH", $VALUE)
              - patterns:
                  - pattern: |
                      def $FUNCTION(..., $SWITCH, ...):
                          ...
                  - focus-metavariable: $SWITCH
          - metavariable-regex:
              metavariable: $SWITCH
              regex: ^(ignore_(\w*validat\w*|mandatory|links|linked_doctypes|on_trash)|in_(import|install))$
      - patterns:
          - pattern: $DOC.$RAW(...)
          - metavariable-regex:
              metavariable: $RAW
              regex: ^(db_set|db_insert|db_update|db_update_all|update_child_table|update_children|update_single)$
      - pattern: frappe.model.document.bulk_insert(...)
      - patterns:
          - pattern-either:
              - pattern: frappe.db.$WRITE(...)
              - patterns:
                  - pattern: frappe.local.$HANDLE.$WRITE(...)
                  - metavariable-regex:
                      metavariable: $HANDLE
                      regex: ^(db|primary_db|replica_db)$
          - metavariable-regex:
              metavariable: $WRITE
              regex: ^(set_value|set_single_value|delete|truncate|bulk_insert|bulk_update)$
      - patterns:
          - pattern: frappe.qb.$WRITE(...)
          - metavariable-regex:
              metavariable: $WRITE
              regex: ^(update|into)$
      - pattern: frappe.qb.from_(...). ... .delete(...)
      - patterns:
          - pattern-either:
              - pattern: frappe.qb.get_query(..., $WRITE=$VALUE, ...)
              - pattern: frappe.get_query(..., $WRITE=$VALUE, ...)
          - metavariable-regex:
              metavariable: $WRITE
              regex: ^(update|into|delete)$
      - patterns:
          - pattern: $QUERY.$WRITE(...). ... .run(...)
          - metavariable-regex:
              metavariable: $WRITE
              regex: ^(update|insert|delete)$
          - pattern-not: frappe.qb.update(...). ... .run(...)
          - pattern-not: frappe.qb.into(...). ... .run(...)
          - pattern-not: frappe.qb.from_(...). ... .run(...)
      - patterns:
          - pattern: $OBJECT.$FUNCTION(..., $SWITCH=$VALUE, ...)
          - metavariable-regex:
              metavariable: $FUNCTION
              regex: ^(delete|delete_doc|delete_doc_if_exists|rename|_rename|rename_doc)$
          - metavariable-regex:
              metavariable: $SWITCH
              regex: ^(force|for_reload|validate|validate_rename)$
      - patterns:
          - pattern: $MODULE.$DELETE($DOCTYPE, $NAME, $FORCE, ...)
          - metavariable-regex:
              metavariable: $DELETE
              regex: ^delete_doc(_if_exists)?$
      - patterns:
          - pattern-either:
              - pattern: $MODULE.rename_doc($DOCTYPE, $OLD, $NEW, $FORCE, ...)
              - pattern: $DOC.rename($NAME, $MERGE, $FORCE, ...)
              - pattern: $DOC._rename($NAME, $MERGE, $FORCE, ...)
          - pattern-not: frappe.client.rename_doc(...)
    paths:
      exclude:
        - /nik_crafts/patches
        - test_*.py
        - /nik_crafts/tests

  - id: manual-rollback
    languages: [python]
    severity: HIGH
    message: >-
      One call is one transaction, and Frappe ends it. An intended rollback stands in repositories/
      or nc_core/, and the line directly above it holds nothing but:
      # nosemgrep: manual-rollback -- <why it is needed>
    pattern-either:
      - pattern: $DB.rollback(...)
      - pattern: frappe.database.savepoint(...)
      - pattern: frappe.database.database.savepoint(...)
    paths:
      exclude:
        - /nik_crafts/patches
        - test_*.py
        - /nik_crafts/tests

  - id: rights-in-role-table
    languages: [python]
    severity: HIGH
    message: Rights live in the role table of the DocType. Ask frappe.has_permission instead of naming a role.
    pattern-either:
      - pattern: $USER.get_roles(...)
      - pattern: frappe.only_for(...)
    paths:
      exclude:
        - test_*.py
        - /nik_crafts/tests

  - id: endpoint-checks-permission
    languages: [python]
    severity: HIGH
    message: >-
      An own endpoint is a function under @frappe.whitelist(...) that checks a right of its caller before
      it does anything: frappe.has_permission(..., throw=True), without a user, is its first statement.
    pattern-either:
      - patterns:
          - pattern-not-inside: |
              class $CONTROLLER(...):
                  ...
          - pattern-either:
              - patterns:
                  - pattern: |
                      @frappe.whitelist(...)
                      def $ENDPOINT(...):
                          ...
                  - pattern-not: |
                      @frappe.whitelist(...)
                      def $ENDPOINT(...):
                          frappe.has_permission(..., throw=True, ...)
                          ...
                  - pattern-not: |
                      @frappe.whitelist(...)
                      def $ENDPOINT(...):
                          "..."
                          frappe.has_permission(..., throw=True, ...)
                          ...
              - patterns:
                  - pattern-either:
                      - pattern: |
                          @frappe.whitelist(...)
                          def $ENDPOINT(...):
                              $CHECK
                              ...
                      - pattern: |
                          @frappe.whitelist(...)
                          def $ENDPOINT(...):
                              "..."
                              $CHECK
                              ...
                  - metavariable-pattern:
                      metavariable: $CHECK
                      pattern-either:
                        - pattern: frappe.has_permission(..., user=$USER, ...)
                        - pattern: frappe.has_permission($DOCTYPE, $PTYPE, $DOC, $USER, ...)
                        - pattern: $CONDITION and frappe.has_permission(...)
                        - pattern: $CONDITION or frappe.has_permission(...)
      - patterns:
          - pattern: frappe.whitelist
          - pattern-not-inside: |
              @frappe.whitelist(...)
              def $ENDPOINT(...):
                  ...

  - id: endpoints-in-api
    languages: [python]
    severity: HIGH
    message: Own endpoints live in api/. Outside it only a controller method in doctype/ is whitelisted.
    patterns:
      - pattern: frappe.whitelist
      - pattern-not-inside: |
          class $CONTROLLER(...):
              ...
    paths:
      exclude:
        - /nik_crafts/nc_*/api

  - id: refuse-in-core
    languages: [python]
    severity: HIGH
    message: Refuse through the function in nc_core/. frappe.throw and Frappe's exceptions are raised only there.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: frappe.$THROW(...)
              - pattern: frappe.utils.messages.$THROW(...)
          - metavariable-regex:
              metavariable: $THROW
              regex: ^throw(_permission_error)?$
      - pattern: $MODULE.msgprint(..., raise_exception=$EXCEPTION, ...)
      - pattern: $MODULE.msgprint($MESSAGE, $TITLE, $EXCEPTION, ...)
      - pattern: raise frappe.$EXCEPTION(...)
      - pattern: raise frappe.$EXCEPTION
      - pattern: raise frappe.exceptions.$EXCEPTION(...)
      - pattern: raise frappe.exceptions.$EXCEPTION
    paths:
      exclude:
        - /nik_crafts/nc_core

  - id: tests-are-not-imported
    languages: [python]
    severity: HIGH
    message: >-
      A test module is imported by tests only: the rules for data access and for a bypass leave it out.
      Move what other code needs to its place in the feature.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import $MODULE
              - pattern: from $MODULE import $NAME
          - metavariable-regex:
              metavariable: $MODULE
              regex: ^(.*\.)?test_[\w.]*$
      - patterns:
          - pattern: from $MODULE import $NAME
          - metavariable-regex:
              metavariable: $NAME
              regex: ^test_\w*$
    paths:
      exclude:
        - test_*.py

  - id: endpoint-names-methods
    languages: [python]
    severity: HIGH
    message: >-
      An own endpoint and a whitelisted controller method name their one HTTP method in the one form this
      rule reads: the keyword methods with a list that holds it, methods=["POST"] or methods=["GET"].
      POST is for anything that changes data, for a read that takes a list, and for a controller method a
      form script calls, because frm.call sends POST. GET is for any other read. The reason: without
      methods Frappe also accepts GET, and what a GET request writes is rolled back without an error.
    patterns:
      - pattern: frappe.whitelist
      - pattern-not-inside: frappe.whitelist(..., methods=["GET"], ...)
      - pattern-not-inside: frappe.whitelist(..., methods=["POST"], ...)
